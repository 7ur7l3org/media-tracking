<!DOCTYPE html>
<html>
<head>
  <title>Service Worker API Test</title>
</head>
<body>
  <h1>SW-based Client API</h1>
  <button onclick="callAPI()">Call API</button>
  <pre id="output"></pre>
  <hr>
  <p>See the Network tab for the timing of <code>/api/func1</code> and Sources → sw.js to inspect API logic.</p>

  <script>
    async function callAPI() {
      // Register and activate SW if not already
      const registration = await navigator.serviceWorker.register('./sw.js');
      await navigator.serviceWorker.ready;

      // SW takes control without reload now
      if (navigator.serviceWorker.controller === null) {
        console.log('Waiting for SW control...');
        // Add retry logic if needed — but skip reload
        await new Promise(resolve => setTimeout(resolve, 500));
      }

      const res = await fetch('/api/func1?x=abc&y=def');
      const json = await res.json();

      document.getElementById('output').textContent =
        `Got from SW API:\n${JSON.stringify(json, null, 2)}`;
    }
  </script>
</body>
</html>
